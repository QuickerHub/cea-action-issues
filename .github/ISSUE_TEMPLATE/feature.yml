name: Feature
description: New capability or improvement
title: "[area] "
labels: ["type:feat"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area:actions
        - area:packages
        - area:clip
        - area:qkrpc
        - area:userscripts
        - area:tooling
        - area:meta
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This issue contains only information safe to publish publicly
          required: true
