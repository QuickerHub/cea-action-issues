name: Bug
description: Something is broken or behaves incorrectly
title: "[area] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area:actions
        - area:packages
        - area:clip
        - area:qkrpc
        - area:userscripts
        - area:tooling
        - area:meta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected vs what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: e.g. Quicker 1.x, package 1.2.3.4, Windows 11
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I did not include secrets or private paths in this report
          required: true
